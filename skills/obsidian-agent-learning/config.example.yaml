# Copy this file to config.local.yaml (same directory) and set your paths.
# config.local.yaml is gitignored — do not commit machine-specific values.
#
# Alternative: export OBSIDIAN_VAULT=/absolute/path/to/vault

vault: /path/to/your/obsidian-vault

# Optional: path to the Contents map (the folder-structure index the skill
# reads first and updates last). Relative paths are resolved under vault.
# Default: _contents-map.md  (i.e. <vault>/_contents-map.md)
# contents_map: _contents-map.md
